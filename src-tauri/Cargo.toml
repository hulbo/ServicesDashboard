[package]
name = "services-dashboard"
version = "0.1.7"
description = "IntelliJ 없이 로컬 개발 서비스를 띄우는 가벼운 서비스 대시보드"
authors = ["hulbo"]
license = "MIT"
repository = "https://github.com/hulbo/ServicesDashboard"
edition = "2024"
rust-version = "1.90"

[lib]
name = "services_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: 화면에서 넘어온 값(Tauri IPC는 serde_json::Value를 거친다)의 키 순서를 지킨다.
# 없으면 환경변수가 저장할 때마다 이름순으로 바뀐다.
serde_json = { version = "1.0", features = ["preserve_order"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
encoding_rs = "0.8.44"
dirs = "7.0.0"
indexmap = { version = "2.14.2", features = ["serde"] }
roxmltree = "0.21.2"
regex = { version = "1.13.2", default-features = false, features = ["perf", "std", "unicode-case", "unicode-perl"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
# 설치된 글꼴 목록 (DirectWrite). Tauri(WebView2)가 이미 쓰는 버전과 같다.
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite"] }

[dev-dependencies]
tempfile = "3.27.0"
