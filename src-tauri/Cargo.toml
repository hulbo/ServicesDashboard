[package]
name = "services-dashboard"
version = "0.1.0"
description = "IntelliJ 없이 로컬 개발 서비스를 띄우는 가벼운 서비스 대시보드"
authors = ["hulbo"]
license = "MIT"
repository = "https://github.com/hulbo/ServicesDashboard"
edition = "2024"
rust-version = "1.90"

[lib]
name = "services_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
encoding_rs = "0.8.44"
dirs = "7.0.0"
indexmap = { version = "2.14.2", features = ["serde"] }
roxmltree = "0.21.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"
